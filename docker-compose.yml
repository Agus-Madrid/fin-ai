version: "3.9"

services:
  mysql:
    build:
      context: ./docker/mysql
    container_name: finai-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finai
      MYSQL_USER: finai
      MYSQL_PASSWORD: finai
    volumes:
      - finai-mysql-data:/var/lib/mysql
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: finai-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - finai-minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: finai-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: finai-uploads
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        /usr/bin/mc mb --ignore-existing local/$$MINIO_BUCKET
        /usr/bin/mc anonymous set none local/$$MINIO_BUCKET
        echo "MinIO bucket ready: $$MINIO_BUCKET"

volumes:
  finai-mysql-data:
  finai-minio-data:
