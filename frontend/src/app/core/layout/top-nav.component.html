<header class="app-top-nav">
  <div class="app-top-nav__inner">
    <div class="app-top-nav__brand">
      <div class="app-top-nav__logo">
        <i class="bi bi-wallet2"></i>
      </div>
      <span>FinAI</span>
    </div>

    <nav class="app-top-nav__links">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        class="app-top-nav__link"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="app-top-nav__actions">
      <div class="app-top-nav__notifications">
        <button type="button" class="app-top-nav__icon" (click)="onToggleNotifications()">
          <i class="bi bi-bell"></i>
          <span class="app-top-nav__dot" *ngIf="hasNotifications()"></span>
        </button>
        <div class="app-top-nav__notifications-panel" *ngIf="notificationsOpen()">
          <div class="app-top-nav__notifications-header">
            <span>Notificaciones</span>
            <span class="app-top-nav__notifications-count">{{ notifications().length }}</span>
          </div>
          <div class="app-top-nav__notifications-empty" *ngIf="notifications().length === 0">
            No hay alertas por ahora.
          </div>
          <button
            type="button"
            class="app-top-nav__notification app-top-nav__notification-action"
            *ngFor="let notification of notifications()"
            [ngClass]="getNotificationToneClass(notification.tone)"
            (click)="onNotificationSelected(notification)">
            <div class="app-top-nav__notification-title">{{ notification.title }}</div>
            <div class="app-top-nav__notification-message">{{ notification.message }}</div>
          </button>
        </div>
      </div>
      <div class="app-top-nav__divider"></div>
      <div class="app-top-nav__user">
        <span class="app-top-nav__user-name">{{ currentUser()?.name || 'Usuario' }}</span>
        <span class="app-top-nav__user-email">{{ currentUser()?.email || '' }}</span>
      </div>
      <div class="app-top-nav__avatar">{{ avatarLabel() }}</div>
      <button type="button" class="app-top-nav__logout" (click)="onSignOut()">
        Salir
      </button>
    </div>
  </div>
</header>
